services:
  # Layer 3: Database (Persistence)
  db:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  # Layer 2: Web Server (PHP Application)
  web-server:
    build: ./docker/web-server
    container_name: web-server-docker
    depends_on:
      - db
    # Mounting host system files to allow real-time monitoring
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    restart: always

  # Layer 1: Proxy (Edge Security & Routing)
  proxy:
    image: nginx:latest
    container_name: proxy-nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/proxy/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - web-server

# Persistent volume for the database
volumes:
  postgres_data:
