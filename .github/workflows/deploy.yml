name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Automate Deployment
    runs-on: ubuntu-latest
    
    steps:
      - name: Executando comandos via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/devops-cloud-stack
            # Força o servidor a ignorar mudanças manuais e ficar igual ao GitHub
            git fetch --all
            git reset --hard origin/main
            # Reconstrói os containers ignorando cache
            docker compose build --no-cache web-server
            docker compose up -d --force-recreate
